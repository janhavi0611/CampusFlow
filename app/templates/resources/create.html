{% extends "base.html" %}

{% block title %}Add Resource - CampusFlow{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl">
  <div class="rounded-2xl border border-brand-200/80 bg-white p-8 shadow-xl">
    <div class="flex items-center justify-between border-b border-brand-100 pb-4">
      <div>
        <h1 class="text-2xl font-extrabold text-ink">Add New Resource</h1>
        <p class="text-xs text-stone-500 mt-1">Register a new venue or equipment for event allocations</p>
      </div>
      <a href="{{ url_for('resources.list_resources') }}" class="text-xs font-semibold text-stone-500 hover:text-stone-800">&larr; Back to Resources</a>
    </div>

    <form method="POST" action="{{ url_for('resources.create_resource') }}" class="mt-6 space-y-5">
      <div>
        <label for="name" class="block text-xs font-bold uppercase tracking-wider text-stone-700">Resource Name *</label>
        <input type="text" id="name" name="name" required
               class="mt-1 w-full rounded-xl border border-brand-200 bg-brand-50/30 px-4 py-2.5 text-sm text-stone-800 focus:border-brand-500 focus:outline-none"
               placeholder="e.g. Auditorium A or Projector Alpha">
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label for="resource_type" class="block text-xs font-bold uppercase tracking-wider text-stone-700">Resource Type *</label>
          <select id="resource_type" name="resource_type" required
                  class="mt-1 w-full rounded-xl border border-brand-200 bg-brand-50/30 px-4 py-2.5 text-sm text-stone-800 focus:border-brand-500 focus:outline-none">
            {% for t in resource_types %}
            <option value="{{ t }}">{{ t }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label for="capacity" class="block text-xs font-bold uppercase tracking-wider text-stone-700">Capacity (Venues only)</label>
          <input type="number" id="capacity" name="capacity" min="1"
                 class="mt-1 w-full rounded-xl border border-brand-200 bg-brand-50/30 px-4 py-2.5 text-sm text-stone-800 focus:border-brand-500 focus:outline-none"
                 placeholder="e.g. 250 (leave empty for equipment)">
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-brand-100">
        <a href="{{ url_for('resources.list_resources') }}" class="rounded-xl border border-stone-200 px-5 py-2.5 text-xs font-semibold text-stone-600 hover:bg-stone-50">Cancel</a>
        <button type="submit" class="rounded-xl bg-brand-600 px-6 py-2.5 text-xs font-bold text-white shadow hover:bg-brand-700 transition">Save Resource</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
