{% extends "base.html" %}

{% block title %}Create Event - CampusFlow{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl">
  <div class="rounded-2xl border border-brand-200/80 bg-white p-8 shadow-xl">
    <div class="flex items-center justify-between border-b border-brand-100 pb-4">
      <div>
        <h1 class="text-2xl font-extrabold text-ink">Schedule New Event</h1>
        <p class="text-xs text-stone-500 mt-1">Enter event parameters, organizer, and attendance details</p>
      </div>
      <a href="{{ url_for('events.list_events') }}" class="text-xs font-semibold text-stone-500 hover:text-stone-800">&larr; Back to Events</a>
    </div>

    <form method="POST" action="{{ url_for('events.create_event') }}" class="mt-6 space-y-5">
      <div>
        <label for="name" class="block text-xs font-bold uppercase tracking-wider text-stone-700">Event Name *</label>
        <input type="text" id="name" name="name" required
               class="mt-1 w-full rounded-xl border border-brand-200 bg-brand-50/30 px-4 py-2.5 text-sm text-stone-800 focus:border-brand-500 focus:outline-none"
               placeholder="e.g. Annual Tech Symposium 2026">
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label for="organizer" class="block text-xs font-bold uppercase tracking-wider text-stone-700">Organizer Name *</label>
          <input type="text" id="organizer" name="organizer" value="{{ current_user.name }}" required
                 class="mt-1 w-full rounded-xl border border-brand-200 bg-brand-50/30 px-4 py-2.5 text-sm text-stone-800 focus:border-brand-500 focus:outline-none">
        </div>

        <div>
          <label for="expected_attendance" class="block text-xs font-bold uppercase tracking-wider text-stone-700">Expected Attendance *</label>
          <input type="number" id="expected_attendance" name="expected_attendance" min="1" required
                 class="mt-1 w-full rounded-xl border border-brand-200 bg-brand-50/30 px-4 py-2.5 text-sm text-stone-800 focus:border-brand-500 focus:outline-none"
                 placeholder="e.g. 150">
        </div>
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label for="start_datetime" class="block text-xs font-bold uppercase tracking-wider text-stone-700">Start Date & Time *</label>
          <input type="datetime-local" id="start_datetime" name="start_datetime" required
                 class="mt-1 w-full rounded-xl border border-brand-200 bg-brand-50/30 px-4 py-2.5 text-sm text-stone-800 focus:border-brand-500 focus:outline-none">
        </div>

        <div>
          <label for="end_datetime" class="block text-xs font-bold uppercase tracking-wider text-stone-700">End Date & Time *</label>
          <input type="datetime-local" id="end_datetime" name="end_datetime" required
                 class="mt-1 w-full rounded-xl border border-brand-200 bg-brand-50/30 px-4 py-2.5 text-sm text-stone-800 focus:border-brand-500 focus:outline-none">
        </div>
      </div>

      <div>
        <label for="description" class="block text-xs font-bold uppercase tracking-wider text-stone-700">Event Description</label>
        <textarea id="description" name="description" rows="3"
                  class="mt-1 w-full rounded-xl border border-brand-200 bg-brand-50/30 px-4 py-2 text-sm text-stone-800 focus:border-brand-500 focus:outline-none"
                  placeholder="Provide an overview of the event objective and requirements..."></textarea>
      </div>

      <div>
        <label for="status" class="block text-xs font-bold uppercase tracking-wider text-stone-700">Initial Status</label>
        <select id="status" name="status" class="mt-1 w-full rounded-xl border border-brand-200 bg-brand-50/30 px-4 py-2.5 text-sm text-stone-800 focus:border-brand-500 focus:outline-none">
          <option value="Draft">Draft</option>
          <option value="Submitted">Submitted for Review</option>
        </select>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-brand-100">
        <a href="{{ url_for('events.list_events') }}" class="rounded-xl border border-stone-200 px-5 py-2.5 text-xs font-semibold text-stone-600 hover:bg-stone-50">Cancel</a>
        <button type="submit" class="rounded-xl bg-brand-600 px-6 py-2.5 text-xs font-bold text-white shadow hover:bg-brand-700 transition">Save & Schedule</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
