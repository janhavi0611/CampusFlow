{% extends "base.html" %}

{% block title %}Log In - CampusFlow{% endblock %}

{% block content %}
<div class="mx-auto max-w-md py-8">
  <div class="rounded-2xl border border-brand-200/80 bg-white p-8 shadow-xl">
    <div class="text-center">
      <div class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-brand-50 text-brand-700 shadow-inner">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-7 h-7">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
        </svg>
      </div>
      <h2 class="mt-4 text-2xl font-extrabold text-ink">Welcome to CampusFlow</h2>
      <p class="mt-1 text-sm text-stone-500">Sign in to manage events and resource requests</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" class="mt-6 space-y-4">
      <div>
        <label for="username" class="block text-xs font-semibold text-stone-700 uppercase tracking-wider">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username"
               class="mt-1 w-full rounded-xl border border-brand-200 bg-brand-50/30 px-4 py-2.5 text-sm text-stone-800 focus:border-brand-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition"
               placeholder="Enter your username">
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-stone-700 uppercase tracking-wider">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password"
               class="mt-1 w-full rounded-xl border border-brand-200 bg-brand-50/30 px-4 py-2.5 text-sm text-stone-800 focus:border-brand-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition"
               placeholder="Enter your password">
      </div>

      <button type="submit"
              class="w-full rounded-xl bg-brand-600 px-4 py-3 text-sm font-bold text-white shadow-md hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500/40 transition">
        Sign In
      </button>
    </form>

    <!-- Demo Credentials Quick Helper Box -->
    <div class="mt-8 rounded-xl border border-brand-200/60 bg-brand-50/70 p-4">
      <h3 class="text-xs font-bold uppercase tracking-wider text-brand-800">Demo Accounts</h3>
      <div class="mt-2 space-y-1.5 text-xs text-stone-700">
        <div class="flex justify-between items-center bg-white/70 px-2.5 py-1.5 rounded-lg border border-brand-100">
          <span class="font-semibold text-brand-900">Admin</span>
          <code class="text-[11px] text-stone-600 bg-stone-100 px-1.5 py-0.5 rounded">admin / admin123</code>
        </div>
        <div class="flex justify-between items-center bg-white/70 px-2.5 py-1.5 rounded-lg border border-brand-100">
          <span class="font-semibold text-brand-900">Organizer</span>
          <code class="text-[11px] text-stone-600 bg-stone-100 px-1.5 py-0.5 rounded">organizer / org123</code>
        </div>
        <div class="flex justify-between items-center bg-white/70 px-2.5 py-1.5 rounded-lg border border-brand-100">
          <span class="font-semibold text-brand-900">Organizer 2</span>
          <code class="text-[11px] text-stone-600 bg-stone-100 px-1.5 py-0.5 rounded">organizer2 / org123</code>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
